name: nightly
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
# The same group as acceptance.yml: every run shares one Clerk instance.
concurrency:
  group: clerk-acceptance-instance
  cancel-in-progress: false
jobs:
  # The suite itself lives in acceptance-suite.yml, shared with
  # acceptance.yml. The nightly run exists because Clerk changes its API
  # with no change on our side. It runs the suite once for each CLI that the
  # README promises: the oldest supported Terraform, the latest Terraform,
  # and OpenTofu. max-parallel is 1 because the three runs share the
  # instance. The pull request run covers the pinned Terraform only.
  acceptance:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - tool: terraform
            version: "1.5.7"
          - tool: terraform
            version: latest
          - tool: opentofu
            version: "1.12.9"
    uses: ./.github/workflows/acceptance-suite.yml
    with:
      tool: ${{ matrix.tool }}
      version: ${{ matrix.version }}
    secrets:
      CLERK_SECRET_KEY_ACC: ${{ secrets.CLERK_SECRET_KEY_ACC }}
  # Native Go fuzzing of the functions that read input from outside the
  # provider: the Retry-After header of a rate-limited response, and the
  # SAML certificate from the config or from Clerk. The unit job runs their
  # seed corpus on every pull request; this job explores new inputs for a
  # minute each. It needs no Clerk instance, so it runs in parallel with the
  # acceptance matrix.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./internal/clerkapi -run='^$' -fuzz='^FuzzRetryAfter$' -fuzztime=60s
      - run: go test ./internal/resources/samlconn -run='^$' -fuzz='^FuzzCertBody$' -fuzztime=60s
      - run: go test ./internal/resources/samlconn -run='^$' -fuzz='^FuzzCertBodyText$' -fuzztime=60s
