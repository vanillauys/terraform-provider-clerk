name: nightly
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
# The same group as acceptance.yml: every run shares one Clerk instance.
concurrency:
  group: clerk-acceptance-instance
  cancel-in-progress: false
jobs:
  # The suite itself lives in acceptance-suite.yml, shared with
  # acceptance.yml. The nightly run exists because Clerk changes its API
  # with no change on our side. It runs the suite once for each CLI that the
  # README promises: the oldest supported Terraform, the latest Terraform,
  # and OpenTofu. max-parallel is 1 because the three runs share the
  # instance. The pull request run covers the pinned Terraform only.
  acceptance:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - tool: terraform
            version: "1.5.7"
          - tool: terraform
            version: latest
          - tool: opentofu
            version: "1.12.9"
    uses: ./.github/workflows/acceptance-suite.yml
    with:
      tool: ${{ matrix.tool }}
      version: ${{ matrix.version }}
    secrets:
      CLERK_SECRET_KEY_ACC: ${{ secrets.CLERK_SECRET_KEY_ACC }}
