name: Feature request
description: A Clerk feature that the provider does not model yet.
labels: [enhancement]
body:
  - type: input
    id: feature
    attributes:
      label: Clerk feature
      description: The screen in the Clerk dashboard, or the Backend API endpoint.
      placeholder: "Restrictions in the dashboard, or PATCH /instance/restrictions"
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: What you want to do with Terraform
      description: The configuration you would write, in prose or in HCL.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: The dashboard steps or the API calls that the resource would replace.
